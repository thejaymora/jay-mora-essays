[build]
  publish = "."

[[redirects]]
  from = "/the-closer-who-talks-25-percent-closes-more"
  to = "/talk-less-close-more"
  status = 301
  force = true

# Internal documents are never served publicly
[[redirects]]
  from = "/internal/*"
  to = "/"
  status = 404
  force = true

# Cache static assets aggressively
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
